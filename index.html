const fmt = n => { n=Math.round(Number(n)||0); return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-CO'); };
const p2 = n => String(n).padStart(2,'0');

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const diaNombre = f => { const d=new Date(f+'T12:00:00'); return f===hoyStr()?'Hoy':DIAS[d.getDay()]+' '+d.getDate(); };

// Ajuste de saldo: movimiento con categoría reservada. Mueve la plata de banco/efectivo
// pero NO cuenta como ingreso ni como gasto del mes.
const AJUSTE = 'Ajuste';
const esAjuste = m => m.categoria===AJUSTE;
// Plata que hay en banco y en efectivo: acumulado de todo lo anotado hasta el mes dado (sin mes = todo).
// Las compras con tarjeta no tocan el saldo (lo toca el abono); el ahorro se cuenta como salido del banco.
function saldos(datos,ambito,hastaMes){
  const ok=f=>!hastaMes||f.slice(0,7)<=hastaMes;
  let banco=0, efectivo=0;
  datos.movimientos.forEach(m=>{
    if(m.ambito!==ambito||!ok(m.fecha)||m.medio==='tarjeta') return;
    const v=(m.tipo==='ingreso'?1:-1)*Number(m.monto);
    if(m.medio==='efectivo') efectivo+=v; else banco+=v;
  });
  banco-=suma(datos.meta_aportes.filter(a=>a.ambito===ambito&&ok(a.fecha)));
  return {banco,efectivo};
}

  const pre=(u,amb,cat,monto)=>s.presupuestos.push({id:uuid(),hogar_id:'h1',usuario_id:u,ambito:amb,categoria:cat,monto});

// ───────── Capa de datos (Supabase o demo) ─────────
async function traerTodo(tabla){
  // PostgREST corta en 1000 filas: siempre paginar.
  let out=[], from=0;
  for(;;){
    const {data,error}=await sb.from(tabla).select('*').order('created_at').order('id').range(from,from+999);
    if(error) throw error;
    out=out.concat(data); if(data.length<1000) break; from+=1000;
  }
  return out;
}
const db = {
  async sesion(){
    if(DEMO){ const u=demo.uid(); return u?{id:u}:null; }
    const {data}=await sb.auth.getSession();
    return data.session?{id:data.session.user.id,email:data.session.user.email}:null;
  },
  async login(email,pass){
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error; return {id:data.user.id,email:data.user.email};
  },
  async registro(email,pass){
    const {data,error}=await sb.auth.signUp({email,password:pass});
    if(error) throw error;
    return data.session?{id:data.user.id,email:data.user.email}:null;   // null = falta confirmar el correo

  async cambiarClave(pass){ const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error; },
  async salir(){ if(DEMO) demo.setUid(null); else await sb.auth.signOut(); },

    if(DEMO) return {perfil:{...DEMO_USERS.find(u=>u.id===uid),hogar_id:'h1'},hogar:{id:'h1',nombre:'Nuestra casa',codigo:'DEMO123456'},miembros:DEMO_USERS};

    if(!perfil||!perfil.hogar_id) return {perfil:perfil||null,hogar:null,miembros:[]};

      sb.from('hogares').select('*').maybeSingle(),
      sb.from('perfiles').select('id,nombre').order('created_at'),
    ]);
    return {perfil,hogar,miembros:miembros||[]};
  },

  async todo(uid){
    const out={};
    if(DEMO){ const s=demo.load(); TABLAS.forEach(t=>out[t]=(s[t]||[]).filter(r=>r.ambito==='casa'||r.usuario_id===uid)); return out; }
    const res=await Promise.all(TABLAS.map(traerTodo));
    TABLAS.forEach((t,i)=>out[t]=res[i]); return out;
  },
  async add(tabla,row,uid){
    if(DEMO){ const s=demo.load(); const r={id:uuid(),hogar_id:'h1',usuario_id:uid,created_at:new Date().toISOString(),...row}; s[tabla].push(r); demo.save(s); return r; }
    const {data,error}=await sb.from(tabla).insert(row).select().single(); if(error) throw error; return data;
  },
  async upd(tabla,id,patch){
    if(DEMO){ const s=demo.load(); const i=s[tabla].findIndex(r=>r.id===id); s[tabla][i]={...s[tabla][i],...patch}; demo.save(s); return s[tabla][i]; }
    const {data,error}=await sb.from(tabla).update(patch).eq('id',id).select().single(); if(error) throw error; return data;
  },
  async del(tabla,id){
    if(DEMO){ const s=demo.load(); s[tabla]=s[tabla].filter(r=>r.id!==id);
      if(tabla==='metas') s.meta_aportes=s.meta_aportes.filter(a=>a.meta_id!==id);
      if(tabla==='deudas') s.movimientos.forEach(m=>{if(m.deuda_id===id) m.deuda_id=null;});
      demo.save(s); return; }
    const {error}=await sb.from(tabla).delete().eq('id',id); if(error) throw error;
  },
};
const msgErr = e => {
  const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos';
  if(/already registered/i.test(m)) return 'Ese correo ya tiene cuenta';
  if(/at least 6/i.test(m)) return 'La contraseña debe tener mínimo 6 caracteres';
  if(/Failed to fetch/i.test(m)) return 'Sin conexión. Intenta de nuevo.';
  return m;
};

function Auth({onEntrar}){
  const [modo,setModo]=useState('login'), [email,setEmail]=useState(''), [pass,setPass]=useState('');
  const [err,setErr]=useState(''), [info,setInfo]=useState(''), [busy,setBusy]=useState(false), [ver,setVer]=useState(false);
  if(DEMO) return <div className="auth">
    <h1>💰 Finanzas de casa <span className="demo-tag">DEMO</span></h1>
    <p>Datos de ejemplo guardados solo en este navegador. Entra como cualquiera de los dos para ver cómo queda el espacio personal de cada uno y el de la casa.</p>
    {DEMO_USERS.map(u=><button key={u.id} className="btn" onClick={()=>{demo.setUid(u.id);onEntrar({id:u.id});}}>Entrar como {u.nombre}</button>)}
  </div>;
  const enviar=async()=>{
    setErr('');setInfo('');setBusy(true);
    try{
      if(modo==='login') onEntrar(await db.login(email.trim(),pass));
      else { const s=await db.registro(email.trim(),pass); if(s) onEntrar(s); else {setInfo('Te enviamos un correo para confirmar la cuenta. Ábrelo y luego entra aquí.');setModo('login');} }
    }catch(e){setErr(msgErr(e));}
    setBusy(false);
  };
  return <div className="auth">
    <h1>💰 Finanzas de casa</h1>
    <p>{modo==='login'?'Entra con tu correo y contraseña.':'Crea tu cuenta. Cada uno tiene la suya.'}</p>
    <label className="lab">Correo</label>
    <input className="inp" type="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)}/>
    <label className="lab">Contraseña</label>
    <div style={{display:'flex',gap:8}}>
      <input className="inp" type={ver?'text':'password'} autoComplete={modo==='login'?'current-password':'new-password'} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&enviar()}/>
      <button className="ico-btn" style={{height:'auto',flexShrink:0,width:48}} onClick={()=>setVer(!ver)}>{ver?'🙈':'👁'}</button>
    </div>
    {err&&<div className="err">{err}</div>}
    {info&&<div className="nota">{info}</div>}
    <button className="btn" disabled={busy||!email||pass.length<6} onClick={enviar}>{busy?'…':modo==='login'?'Entrar':'Crear cuenta'}</button>
    <button className="link" onClick={()=>{setModo(modo==='login'?'registro':'login');setErr('');}}>{modo==='login'?'No tengo cuenta — crear una':'Ya tengo cuenta — entrar'}</button>
  </div>;
}
function Bienvenida({onListo,onSalir}){
  const [modo,setModo]=useState('crear'), [nombre,setNombre]=useState(''), [hogar,setHogar]=useState('Nuestra casa'), [codigo,setCodigo]=useState('');
  const [err,setErr]=useState(''), [busy,setBusy]=useState(false);
  const enviar=async()=>{
    setErr('');setBusy(true);
    try{ if(modo==='crear') await db.crearHogar(hogar,nombre); else await db.unirseHogar(codigo,nombre); onListo(); }
    catch(e){setErr(msgErr(e));setBusy(false);}
  };
  return <div className="auth">
    <h1>👋 Bienvenido</h1>

      ? <><label className="lab">Nombre de la casa</label><input className="inp" value={hogar} onChange={e=>setHogar(e.target.value)}/>
          <div className="nota">Después te sale un código para invitar a tu pareja.</div></>
      : <><label className="lab">Código de invitación</label><input className="inp" value={codigo} onChange={e=>setCodigo(e.target.value.toUpperCase())}/></>}
    {err&&<div className="err">{err}</div>}
    <button className="btn" disabled={busy||!nombre.trim()||(modo==='unir'&&!codigo.trim())} onClick={enviar}>{busy?'…':'Continuar'}</button>
    <button className="link" onClick={onSalir}>Salir</button>

}

// ───────── App ─────────
function App(){
  const [ses,setSes]=useState(undefined);       // undefined = cargando, null = sin sesión
  const [ctx,setCtx]=useState(null);
  const [datos,setDatos]=useState(null);
  const [ambito,setAmbito]=useState('personal');
  const [mes,setMes]=useState(hoyStr().slice(0,7));
  const [tab,setTab]=useState('resumen');
  const [sheet,setSheet]=useState(null);         // {tipo, ...}
  const [toast,setToast]=useState('');

  const aviso=t=>{setToast(t);setTimeout(()=>setToast(''),2600);};
  useEffect(()=>{ db.sesion().then(setSes).catch(()=>setSes(null)); document.getElementById('loading').style.display='none'; },[]);
  const cargar=async(s)=>{
    try{ const c=await db.contexto(s.id); setCtx(c); if(c.hogar) setDatos(await db.todo(s.id)); }
    catch(e){ aviso(msgErr(e)); }
  };
  useEffect(()=>{ if(ses){setCtx(null);setDatos(null);cargar(ses);} },[ses]);
  const salir=async()=>{ await db.salir(); setSes(null);setCtx(null);setDatos(null);setSheet(null);setTab('resumen');setAmbito('personal'); };

  // Guardar / borrar con actualización local
  const guardar=async(tabla,row)=>{
    try{
      const {id,created_at,hogar_id,usuario_id,...campos}=row;
      const r = id ? await db.upd(tabla,id,campos) : await db.add(tabla,campos,ses.id);
      setDatos(d=>({...d,[tabla]: id ? d[tabla].map(x=>x.id===id?r:x) : [...d[tabla],r]}));
      return r;
    }catch(e){ aviso(msgErr(e)); return null; }
  };
  const borrar=async(tabla,id)=>{
    try{
      await db.del(tabla,id);
      setDatos(d=>({...d,[tabla]:d[tabla].filter(x=>x.id!==id),
        ...(tabla==='metas'?{meta_aportes:d.meta_aportes.filter(a=>a.meta_id!==id)}:{}),
        ...(tabla==='deudas'?{movimientos:d.movimientos.map(m=>m.deuda_id===id?{...m,deuda_id:null}:m)}:{})}));
      return true;
    }catch(e){ aviso(msgErr(e)); return false; }
  };

  if(ses===undefined) return null;
  if(!ses) return <Auth onEntrar={setSes}/>;
  if(!ctx) return <div className="auth" style={{alignItems:'center'}}><div className="loader"/></div>;
  if(!ctx.hogar) return <Bienvenida onListo={()=>cargar(ses)} onSalir={salir}/>;
  if(!datos) return <div className="auth" style={{alignItems:'center'}}><div className="loader"/></div>;

  const uid=ses.id;
  const nombreDe=id=>{ const m=ctx.miembros.find(x=>x.id===id); return m?m.nombre:'—'; };
  const catsDe=(amb,tipo)=>[...CATS[amb][tipo],...datos.categorias.filter(c=>c.ambito===amb&&c.tipo===tipo).map(c=>[c.emoji||'🏷️',c.nombre])];
  const emojiDe=(nombre,m)=>{
    if(m&&m.tipo==='abono') return '💳';
    if(nombre===AJUSTE) return '⚖️';
    for(const a of ['personal','casa']) for(const t of ['gasto','ingreso']){ const c=catsDe(a,t).find(c=>c[1]===nombre); if(c) return c[0]; }
    return '🏷️';
  };
  const saldoDeuda=d=>Number(d.monto_inicial||0)+suma(datos.movimientos.filter(m=>m.deuda_id===d.id&&m.tipo==='gasto'))-suma(datos.movimientos.filter(m=>m.deuda_id===d.id&&m.tipo==='abono'));
  const ahorradoMeta=mt=>suma(datos.meta_aportes.filter(a=>a.meta_id===mt.id));

  const P={uid,ctx,datos,ambito,mes,nombreDe,catsDe,emojiDe,saldoDeuda,ahorradoMeta,guardar,borrar,aviso,abrir:setSheet,ir:setTab};
  const cerrar=()=>setSheet(null);

  return <div className="app" data-amb={ambito}>
    <div className="top">
      <div className="top-row">
        <div className="hola">{ambito==='casa'?ctx.hogar.nombre:'Tu espacio personal'}<b>{ambito==='casa'?'🏠 Gastos de la casa':'👤 '+ctx.perfil.nombre}{DEMO&&<span className="demo-tag">DEMO</span>}</b></div>
        <button className="ico-btn" onClick={()=>setSheet({tipo:'ajustes'})}>⚙️</button>
      </div>
      <div className="seg">
        <button className={ambito==='personal'?'on':''} onClick={()=>setAmbito('personal')}>👤 Lo mío</button>
        <button className={ambito==='casa'?'on':''} onClick={()=>setAmbito('casa')}>🏠 La casa</button>
      </div>
      {(tab==='resumen'||tab==='movs'||tab==='presu')&&<div className="mes">
        <button onClick={()=>setMes(mesMover(mes,-1))}>‹</button><b>{mesNombre(mes)}</b><button onClick={()=>setMes(mesMover(mes,1))}>›</button>
      </div>}
    </div>

    {tab==='resumen'&&<Resumen {...P}/>}
    {tab==='movs'&&<Movimientos {...P}/>}
    {tab==='presu'&&<Presupuestos {...P}/>}
    {tab==='deudas'&&<Deudas {...P}/>}
    {tab==='metas'&&<Metas {...P}/>}

    {(tab==='resumen'||tab==='movs')&&<button className="fab" onClick={()=>setSheet({tipo:'mov'})}>+</button>}
    <div className="tabs"><div>
      {[['resumen','📊','Resumen'],['movs','🧾','Movimientos'],['presu','🎯','Presupuesto'],['deudas','💳','Deudas'],['metas','🐷','Ahorro']].map(([k,e,l])=>
        <button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}><span>{e}</span>{l}</button>)}
    </div></div>

    {sheet&&sheet.tipo==='mov'&&<MovSheet {...P} mov={sheet.mov} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='presu'&&<PresuSheet {...P} cat={sheet.cat} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='deuda'&&<DeudaSheet {...P} deuda={sheet.deuda} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='abono'&&<AbonoSheet {...P} deuda={sheet.deuda} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='meta'&&<MetaSheet {...P} meta={sheet.meta} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='ajuste'&&<AjusteSheet {...P} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='aporte'&&<AporteSheet {...P} meta={sheet.meta} onClose={cerrar}/>}
    {sheet&&sheet.tipo==='ajustes'&&<Ajustes {...P} onClose={cerrar} onSalir={salir} onNombre={n=>setCtx(c=>({...c,perfil:{...c.perfil,nombre:n},miembros:c.miembros.map(m=>m.id===uid?{...m,nombre:n}:m)}))}/>}
    {toast&&<div className="toast">{toast}</div>}
  </div>;
}

// ───────── Resumen ─────────
function FilaMov({m,P,onClick}){
  const sub=[m.categoria, P.ambito==='casa'&&m.tipo!=='ingreso'?'pagó '+P.nombreDe(m.pagado_por):null, m.medio==='tarjeta'?'con tarjeta':null, esAjuste(m)?(m.medio==='efectivo'?'efectivo':'banco'):null].filter(Boolean).join(' · ');
  return <div className="fila" onClick={onClick}>
    <div className="em">{P.emojiDe(m.categoria,m)}</div>
    <div className="tx"><b>{m.descripcion||m.categoria}</b><span>{sub}</span></div>
    <div className={'mt '+(m.tipo==='ingreso'?'pos':'')}>{m.tipo==='ingreso'?'+':'−'}{fmt(m.monto)}</div>
  </div>;
}
function Resumen(P){
  const {datos,ambito,mes,ctx}=P;
  const movs=datos.movimientos.filter(m=>m.ambito===ambito);
  const delMes=movs.filter(m=>m.fecha.slice(0,7)===mes);
  const reales=delMes.filter(m=>!esAjuste(m));
  const gastos=reales.filter(m=>m.tipo==='gasto'), ingresos=suma(reales.filter(m=>m.tipo==='ingreso'));
  const ajustesMes=suma(delMes.filter(esAjuste),m=>m.tipo==='ingreso'?m.monto:-m.monto);
  const totGastos=suma(gastos), abonos=suma(delMes.filter(m=>m.tipo==='abono')), conTarjeta=suma(gastos.filter(m=>m.deuda_id));
  const ahorro=suma(datos.meta_aportes.filter(a=>a.ambito===ambito&&a.fecha.slice(0,7)===mes));
  // Lo que realmente salió del bolsillo: las compras con tarjeta se pagan cuando se abona la tarjeta.
  const salio=totGastos-conTarjeta+abonos;
  const balance=ingresos-salio-ahorro;
  const ingEfectivo=suma(reales.filter(m=>m.tipo==='ingreso'&&m.medio==='efectivo')), ingBanco=ingresos-ingEfectivo;
  const sal=saldos(datos,ambito,mes), mesHoy=hoyStr().slice(0,7);
  const porCat=Object.entries(gastos.reduce((o,m)=>{o[m.categoria]=(o[m.categoria]||0)+Number(m.monto);return o;},{})).sort((a,b)=>b[1]-a[1]);
  const pagadores=ctx.miembros.map(mb=>({...mb,total:suma(delMes.filter(m=>m.tipo!=='ingreso'&&m.pagado_por===mb.id))}));
  const totPag=suma(pagadores,p=>p.total);
  const presu=datos.presupuestos.filter(p=>p.ambito===ambito&&p.monto>0);
  const totPresu=suma(presu), gastoPresu=suma(gastos.filter(m=>presu.some(p=>p.categoria===m.categoria)));
  const deudas=datos.deudas.filter(d=>d.ambito===ambito&&d.activa!==false);
  const totDeuda=suma(deudas,P.saldoDeuda);
  const metas=datos.metas.filter(m=>m.ambito===ambito);
  const seis=[5,4,3,2,1,0].map(i=>{const mm=mesMover(mes,-i);return {mm,v:suma(movs.filter(m=>m.tipo==='gasto'&&!esAjuste(m)&&m.fecha.slice(0,7)===mm))};});
  const max6=Math.max(1,...seis.map(s=>s.v));
  const ultimos=[...delMes].sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.created_at||'').localeCompare(a.created_at||'')).slice(0,5);
  const hayIngresos=ingresos>0||ambito==='personal';

  return <>
    <div className="card hero">
      {hayIngresos ? <>
        <div className="lbl">Te queda este mes</div>
        <div className={'big '+(balance<0?'neg':'')}>{fmt(balance)}</div>
        <div className="kpis">
          <div className="kpi"><span>Ingresos</span><b className="pos">{fmt(ingresos)}</b>
            {ingresos>0&&<span style={{marginTop:3}}>🏦 {fmt(ingBanco)} · 💵 {fmt(ingEfectivo)}</span>}</div>
          <div className="kpi"><span>Gastos</span><b>{fmt(totGastos)}</b></div>
        </div>
        {ambito==='personal'&&<>
          <div className="lbl" style={{marginTop:14,marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>{mes>=mesHoy?'Plata que tienes':'Plata al cierre de '+mesNombre(mes)}</span>
            <button className="btn mini sec" onClick={()=>P.abrir({tipo:'ajuste'})}>⚖️ Ajustar</button>
          </div>
          <div className="kpis">
            <div className="kpi"><span>🏦 En banco</span><b className={sal.banco<0?'neg':''}>{fmt(sal.banco)}</b></div>
            <div className="kpi"><span>💵 En efectivo</span><b className={sal.efectivo<0?'neg':''}>{fmt(sal.efectivo)}</b></div>
          </div>
        </>}
      </> : <>
        <div className="lbl">Gastos de la casa este mes</div>
        <div className="big">{fmt(salio)}</div>
      </>}
      {(abonos>0||ahorro!==0||conTarjeta>0||ajustesMes!==0)&&<div className="nota">
        {ajustesMes!==0&&<>Ajustes de saldo este mes: {ajustesMes>0?'+':''}{fmt(ajustesMes)} (plata que no estaba anotada; no cuenta como ingreso ni gasto). </>}
        {abonos>0&&<>Pagos a deudas {fmt(abonos)}. </>}
        {ahorro!==0&&<>Ahorro {fmt(ahorro)}. </>}
        {conTarjeta>0&&<>Compras con tarjeta {fmt(conTarjeta)} (se descuentan cuando pagues la tarjeta).</>}
      </div>}
    </div>

    {ambito==='casa'&&totPag>0&&<div className="card">
      <h3>Quién ha pagado</h3>
      {pagadores.map(p=><div className="catrow" key={p.id}>
        <div className="l"><b>{p.nombre}</b><span>{fmt(p.total)} · {Math.round(p.total/totPag*100)}%</span></div>
        <Barra pct={p.total/totPag*100} modo="meta"/>
      </div>)}
    </div>}

    {totPresu>0&&<div className="card" onClick={()=>P.ir('presu')}>
      <h3>Presupuesto <button>Ver</button></h3>
      <div className="catrow"><div className="l"><b>{fmt(gastoPresu)} de {fmt(totPresu)}</b><span className={gastoPresu>totPresu?'neg':'dim'}>{gastoPresu>totPresu?'Te pasaste '+fmt(gastoPresu-totPresu):'Quedan '+fmt(totPresu-gastoPresu)}</span></div>
      <Barra pct={gastoPresu/totPresu*100}/></div>
    </div>}

    <div className="card">
      <h3>En qué se fue</h3>
      {porCat.length===0 ? <Vacio e="🧾">Sin gastos en {mesNombre(mes)}.<br/>Toca <b>+</b> para anotar el primero.</Vacio>
      : porCat.slice(0,7).map(([c,v])=><div className="catrow" key={c}>
          <div className="l"><b>{P.emojiDe(c)} {c}</b><span>{fmt(v)} · {Math.round(v/totGastos*100)}%</span></div>
          <div className="bar"><i style={{width:v/porCat[0][1]*100+'%'}}/></div>
        </div>)}
    </div>

    <div className="card">
      <h3>Gastos de los últimos 6 meses</h3>
      <div className="meses6">{seis.map(s=><div key={s.mm}><i className={s.mm===mes?'on':''} style={{height:Math.round(s.v/max6*84)+'px'}}/><span>{MESES[+s.mm.slice(5,7)-1].slice(0,3)}</span></div>)}</div>
    </div>

    {(deudas.length>0||metas.length>0)&&<div className="card">
      {deudas.length>0&&<div className="fila" onClick={()=>P.ir('deudas')}><div className="em">💳</div><div className="tx"><b>Deudas</b><span>{deudas.length} activa{deudas.length>1?'s':''}</span></div><div className="mt neg">{fmt(totDeuda)}</div></div>}
      {metas.length>0&&<div className="fila" onClick={()=>P.ir('metas')}><div className="em">🐷</div><div className="tx"><b>Ahorrado en metas</b><span>{metas.length} meta{metas.length>1?'s':''}</span></div><div className="mt pos">{fmt(suma(metas,P.ahorradoMeta))}</div></div>}
    </div>}

    {ultimos.length>0&&<div className="card">
      <h3>Últimos movimientos <button onClick={()=>P.ir('movs')}>Ver todos</button></h3>
      {ultimos.map(m=><FilaMov key={m.id} m={m} P={P} onClick={()=>P.abrir({tipo:'mov',mov:m})}/>)}
    </div>}
  </>;
}

// ───────── Movimientos ─────────
function Movimientos(P){

// ───────── Ajuste de saldo ─────────
// El usuario dice cuánta plata tiene de verdad y se anota la diferencia como "Ajuste".
function AjusteSheet({onClose,...P}){
  const calc=saldos(P.datos,'personal');
  const [banco,setBanco]=useState(Math.max(0,calc.banco)), [efectivo,setEfectivo]=useState(Math.max(0,calc.efectivo)), [busy,setBusy]=useState(false);
  const dB=banco-calc.banco, dE=efectivo-calc.efectivo;
  const Dif=({d})=>d===0?<span className="dim">Cuadra ✓</span>:<span className={d>0?'pos':'neg'}>Ajuste de {d>0?'+':''}{fmt(d)}</span>;
  const guardar=async()=>{
    setBusy(true);
    for(const [d,medio] of [[dB,'debito'],[dE,'efectivo']]){
      if(d===0) continue;
      if(!await P.guardar('movimientos',{ambito:'personal',tipo:d>0?'ingreso':'gasto',monto:Math.abs(d),categoria:AJUSTE,descripcion:'Ajuste de saldo',fecha:hoyStr(),pagado_por:P.uid,medio,deuda_id:null})){ setBusy(false); return; }
    }
    P.aviso('Saldos ajustados ✓'); onClose();
  };
  return <Sheet titulo="⚖️ Ajustar saldos" onClose={onClose}>
    <div className="nota" style={{marginTop:0}}>Escribe cuánta plata tienes <b>de verdad</b> hoy. La diferencia con lo que calcula la app queda anotada como un ajuste, sin contar como ingreso ni gasto.</div>
    <label className="lab">🏦 En el banco</label>
    <MontoInput value={banco} onChange={setBanco}/>
    <div className="nota" style={{marginTop:6,display:'flex',justifyContent:'space-between'}}><span>La app calcula {fmt(calc.banco)}</span><Dif d={dB}/></div>
    <label className="lab">💵 En efectivo</label>
    <MontoInput value={efectivo} onChange={setEfectivo}/>
    <div className="nota" style={{marginTop:6,display:'flex',justifyContent:'space-between'}}><span>La app calcula {fmt(calc.efectivo)}</span><Dif d={dE}/></div>
    <button className="btn" disabled={busy||(dB===0&&dE===0)} onClick={guardar}>{busy?'Guardando…':'Guardar ajuste'}</button>
  </Sheet>;
}

function Presupuestos(P){
  const {datos,ambito,mes}=P;
  const gastos=datos.movimientos.filter(m=>m.ambito===ambito&&m.tipo==='gasto'&&m.fecha.slice(0,7)===mes);
  const presu=datos.presupuestos.filter(p=>p.ambito===ambito);
  const filas=P.catsDe(ambito,'gasto').map(([e,n])=>({e,n,tope:Number((presu.find(p=>p.categoria===n)||{}).monto||0),gastado:suma(gastos.filter(m=>m.categoria===n))}));
  const con=filas.filter(f=>f.tope>0).sort((a,b)=>b.gastado/b.tope-a.gastado/a.tope), sin=filas.filter(f=>!f.tope);
  const tot=suma(con,f=>f.tope), gas=suma(con,f=>f.gastado);
  return <>
    {con.length>0&&<div className="card hero">
      <div className="lbl">Presupuesto de {mesNombre(mes)}</div>
      <div className="big">{fmt(gas)} <span style={{fontSize:16,fontWeight:500}} className="dim">de {fmt(tot)}</span></div>
      <Barra pct={gas/tot*100}/>

          <div className="l"><b>{f.e} {f.n}</b><span className={f.gastado>f.tope?'neg':''}>{fmt(f.gastado)} / {fmt(f.tope)}</span></div>
          <Barra pct={f.gastado/f.tope*100}/>
          <div className="nota" style={{marginTop:4}}>{f.gastado>f.tope?'Te pasaste por '+fmt(f.gastado-f.tope):'Quedan '+fmt(f.tope-f.gastado)}</div>
        </div>)}
    </div>
    <div className="card">
      <h3>Sin tope</h3>
      {sin.map(f=><div className="fila" key={f.n} onClick={()=>P.abrir({tipo:'presu',cat:f})}>
        <div className="em">{f.e}</div><div className="tx"><b>{f.n}</b><span>{f.gastado?'Gastado '+fmt(f.gastado):'Sin gastos este mes'}</span></div><div className="mt" style={{color:'var(--acc)'}}>+ Tope</div>
      </div>)}
    </div>
  </>;
}

    {metas.map(m=>{
      const pct=m.objetivo>0?m.ahorrado/m.objetivo*100:0, falta=Math.max(0,m.objetivo-m.ahorrado);
      let plan='';
      if(m.fecha_meta&&falta>0){ const h=new Date(), f=new Date(m.fecha_meta+'T12:00:00'); const meses=Math.max(1,(f.getFullYear()-h.getFullYear())*12+f.getMonth()-h.getMonth()+(f.getDate()>=h.getDate()?0:-1)+1);
        plan = f<h ? ' · la fecha ya pasó' : ' · '+fmt(falta/meses)+' al mes para llegar'; }
      return <div className="card" key={m.id}>

          <div className="mt pos">{fmt(m.ahorrado)}</div>
        </div>
        {m.objetivo>0&&<Barra pct={pct} modo="meta"/>}
        <div className="nota" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
          <span>{m.objetivo>0?(falta>0?Math.round(pct)+'% · faltan '+fmt(falta)+plan:'¡Meta cumplida! 🎉'):''}</span>
          <button className="btn mini" onClick={()=>P.abrir({tipo:'aporte',meta:m})}>Aportar</button>

  const aportes=meta?P.datos.meta_aportes.filter(a=>a.meta_id===meta.id).sort((a,b)=>b.fecha.localeCompare(a.fecha)):[];
  const guardar=async()=>{ setBusy(true); const {ahorrado,...row}=f; row.nombre=f.nombre.trim(); row.fecha_meta=f.fecha_meta||null; if(await P.guardar('metas',row)) onClose(); else setBusy(false); };
  const eliminar=async()=>{ if(confirm('¿Borrar la meta "'+meta.nombre+'" y sus aportes?')&&await P.borrar('metas',meta.id)) onClose(); };
  return <Sheet titulo={meta?'Editar meta':'Nueva meta'} onClose={onClose}>
    <div className="chips">{['🎯','✈️','🛟','🏠','🚗','🎓','💍','👶','🎄','💻'].map(e=><button key={e} className={'chip'+(f.emoji===e?' on':'')} onClick={()=>set({emoji:e})}>{e}</button>)}</div>
    <label className="lab">Nombre</label>
    <input className="inp" value={f.nombre} onChange={e=>set({nombre:e.target.value})} placeholder="Ej: Viaje a San Andrés"/>
    {!meta&&<><label className="lab">¿De quién es?</label>
      <Seg value={f.ambito} onChange={a=>set({ambito:a})} ops={[['personal','👤 Mía'],['casa','🏠 De la casa']]}/></>}
    <div className="dos">
      <div><label className="lab">¿Cuánto quieres juntar?</label><MontoInput value={f.objetivo} onChange={v=>set({objetivo:v})}/></div>
      <div><label className="lab">¿Para cuándo?</label><input className="inp" type="date" value={f.fecha_meta||''} onChange={e=>set({fecha_meta:e.target.value})}/></div>
    </div>
    <button className="btn" disabled={busy||!f.nombre.trim()} onClick={guardar}>Guardar</button>
    {aportes.length>0&&<><label className="lab">Aportes</label>
      {aportes.map(a=><div className="fila" key={a.id}>
        <div className="tx"><b>{new Date(a.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}</b><span>{meta.ambito==='casa'?P.nombreDe(a.usuario_id):''}{a.nota?' '+a.nota:''}</span></div>
        <div className={'mt '+(a.monto<0?'neg':'pos')}>{a.monto<0?'':'+'}{fmt(a.monto)}</div>
        <button className="ico-btn" onClick={async()=>{ if(confirm('¿Borrar este aporte?')) await P.borrar('meta_aportes',a.id); }}>🗑</button>
      </div>)}</>}
    {meta&&<button className="btn del" onClick={eliminar}>Borrar meta</button>}
  </Sheet>;
}
function AporteSheet({meta,onClose,...P}){
  const [modo,setModo]=useState('aporte'), [monto,setMonto]=useState(0), [fecha,setFecha]=useState(hoyStr()), [busy,setBusy]=useState(false);
  const guardar=async()=>{
    setBusy(true);
    if(await P.guardar('meta_aportes',{ambito:meta.ambito,meta_id:meta.id,monto:modo==='retiro'?-monto:monto,fecha,nota:null})){P.aviso(modo==='retiro'?'Retiro anotado':'Aporte anotado ✓');onClose();} else setBusy(false);
  };
  return <Sheet titulo={(meta.emoji||'🎯')+' '+meta.nombre} onClose={onClose}>
    <Seg value={modo} onChange={setModo} ops={[['aporte','Aportar'],['retiro','Retirar']]}/>
    <div style={{marginTop:12}}><MontoInput grande autoFocus value={monto} onChange={setMonto}/></div>
    <div className="nota" style={{textAlign:'center'}}>Llevas {fmt(meta.ahorrado)} → quedaría en {fmt(meta.ahorrado+(modo==='retiro'?-monto:monto))}</div>
    <label className="lab">Fecha</label>
    <input className="inp" type="date" value={fecha} onChange={e=>e.target.value&&setFecha(e.target.value)}/>
    <button className="btn" disabled={busy||!(monto>0)} onClick={guardar}>Guardar</button>
  </Sheet>;
}

// ───────── Ajustes ─────────
function Ajustes({onClose,onSalir,onNombre,...P}){
  const {ctx,datos,uid}=P;
  const [nombre,setNombre]=useState(ctx.perfil.nombre);
  const [nc,setNc]=useState({emoji:'',nombre:'',tipo:'gasto',ambito:P.ambito});
  const [clave,setClave]=useState(''), [verClave,setVerClave]=useState(false);
  const cambiarClave=async()=>{ try{ await db.cambiarClave(clave); setClave(''); P.aviso('Contraseña cambiada ✓'); }catch(e){P.aviso(msgErr(e));} };
  const guardarNombre=async()=>{ try{ await db.setNombre(nombre.trim()); onNombre(nombre.trim()); P.aviso('Nombre actualizado'); }catch(e){P.aviso(msgErr(e));} };
  const addCat=async()=>{
    const n=nc.nombre.trim(); if(!n) return;
    if(P.catsDe(nc.ambito,nc.tipo).some(c=>c[1].toLowerCase()===n.toLowerCase())) return P.aviso('Esa categoría ya existe');
    if(await P.guardar('categorias',{ambito:nc.ambito,tipo:nc.tipo,nombre:n,emoji:nc.emoji.trim()||'🏷️'})) setNc({...nc,nombre:'',emoji:''});
  };
  return <Sheet titulo="Ajustes" onClose={onClose}>
    <label className="lab">Tu nombre</label>
    <div style={{display:'flex',gap:8}}>
      <input className="inp" value={nombre} disabled={DEMO} onChange={e=>setNombre(e.target.value)}/>
      {!DEMO&&<button className="btn mini" disabled={!nombre.trim()||nombre.trim()===ctx.perfil.nombre} onClick={guardarNombre}>Guardar</button>}
    </div>

    <label className="lab">{ctx.hogar.nombre} · {ctx.miembros.map(m=>m.nombre).join(' y ')}</label>
    {!DEMO&&<><div className="codigo">{ctx.hogar.codigo}</div>
      <div className="nota">Código de invitación: tu pareja crea su cuenta y lo escribe para entrar a esta casa. Lo personal de cada uno sigue siendo privado.</div></>}

    <label className="lab">Categorías propias</label>
    {datos.categorias.length===0&&<div className="nota" style={{marginTop:0}}>Aún no has creado ninguna.</div>}
    {datos.categorias.map(c=><div className="fila" key={c.id}>
      <div className="em">{c.emoji||'🏷️'}</div>
      <div className="tx"><b>{c.nombre}</b><span>{c.tipo==='gasto'?'Gasto':'Ingreso'} · {c.ambito==='casa'?'De la casa':'Mía'}</span></div>
      <button className="ico-btn" onClick={async()=>{ if(confirm('¿Quitar la categoría "'+c.nombre+'"? Los movimientos que ya la usan no se borran.')) await P.borrar('categorias',c.id); }}>🗑</button>
    </div>)}
    <div style={{display:'flex',gap:8,marginTop:10}}>
      <input className="inp" style={{width:64,textAlign:'center'}} placeholder="🏷️" value={nc.emoji} onChange={e=>setNc({...nc,emoji:e.target.value})}/>
      <input className="inp" placeholder="Nueva categoría" value={nc.nombre} onChange={e=>setNc({...nc,nombre:e.target.value})}/>
    </div>
    <div className="dos" style={{marginTop:8}}>
      <Seg value={nc.tipo} onChange={t=>setNc({...nc,tipo:t})} ops={[['gasto','Gasto'],['ingreso','Ingreso']]}/>
      <Seg value={nc.ambito} onChange={a=>setNc({...nc,ambito:a})} ops={[['personal','👤 Mía'],['casa','🏠 Casa']]}/>
    </div>
    <button className="btn sec" disabled={!nc.nombre.trim()} onClick={addCat}>+ Agregar categoría</button>

    {!DEMO&&<><label className="lab">Cambiar contraseña</label>
      <div style={{display:'flex',gap:8}}>
        <input className="inp" type={verClave?'text':'password'} autoComplete="new-password" placeholder="Nueva (mínimo 6)" value={clave} onChange={e=>setClave(e.target.value)}/>
        <button className="ico-btn" style={{height:'auto',flexShrink:0}} onClick={()=>setVerClave(!verClave)}>{verClave?'🙈':'👁'}</button>
        <button className="btn mini" disabled={clave.length<6} onClick={cambiarClave}>Cambiar</button>
      </div></>}

    {DEMO&&<button className="btn sec" onClick={()=>{ if(confirm('¿Volver a los datos de ejemplo iniciales?')){ try{localStorage.removeItem('fin_demo');}catch(e){} location.reload(); } }}>Reiniciar datos de ejemplo</button>}
    <button className="btn del" onClick={onSalir}>{DEMO?'Cambiar de persona':'Cerrar sesión'}</button>
  </Sheet>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
